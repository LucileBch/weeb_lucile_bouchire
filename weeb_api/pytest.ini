[pytest]
# Always run with the test settings (local PostgreSQL, no Cloudinary, no e-mail)
addopts = --ds=api.settings.test
# The Django project (manage.py) lives in api/
pythonpath = api
testpaths = api
python_files = test_*.py
# collectstatic is never run in tests: the empty STATIC_ROOT warning is expected
filterwarnings =
    ignore:No directory at:UserWarning
