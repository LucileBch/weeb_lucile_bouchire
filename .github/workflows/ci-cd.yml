name: weeb CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only access to the repository is enough for every job
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI - Back-end: pytest on a temporary PostgreSQL database
  # ---------------------------------------------------------------------------
  backend:
    name: Back-end (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weeb_api

    # Same engine as production, like the local Docker container used for tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test database = the PostgreSQL service above
      TEST_DB_PORT: "5432"
      # Placeholder values: required by the settings, never used by the tests
      # (no real database, no Cloudinary upload, no e-mail sent)
      SECRET_KEY: ci-only-insecure-secret-key
      JWT_ACCESS_TOKEN_LIFETIME: "15"
      JWT_REFRESH_TOKEN_LIFETIME: "7"
      DB_NAME: unused
      DB_USER: unused
      DB_PASSWORD: unused
      DB_HOST: unused
      DB_PORT: "5432"
      EMAIL_HOST_USER: unused
      EMAIL_HOST_PASSWORD: unused
      CLOUDINARY_CLOUD_NAME: unused
      CLOUDINARY_API_KEY: unused
      CLOUDINARY_API_SECRET: unused
      CLOUDINARY_PREFIX: unused

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.13.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: |
            weeb_api/requirements.txt
            weeb_api/requirements-dev.txt

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      - name: Exécution des tests
        run: pytest --cov

  # ---------------------------------------------------------------------------
  # CI - Front-end: lint, Vitest, production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Front-end (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weeb_frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: weeb_frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution du linter (ESLint)
        run: npm run lint

      - name: Exécution des tests
        run: npm test -- --run

      - name: Build de l'application
        run: npm run build
        env:
          VITE_API_URL: /api

  # ---------------------------------------------------------------------------
  # CI - Docker: the back-end image deployed on Render must build
  # ---------------------------------------------------------------------------
  docker:
    name: Image Docker (back-end)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t weeb-api ./weeb_api

  # ---------------------------------------------------------------------------
  # CD - Back-end deployment, only after a successful CI on main
  # (the front-end is deployed by Vercel from the protected main branch)
  # ---------------------------------------------------------------------------
  deploy:
    name: Déploiement back-end (Render)
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Déclenchement du Deploy Hook Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
